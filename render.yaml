services:
  - type: web
    name: sandpoint-whatsapp-bot
    runtime: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: WA_PHONE_NUMBER
        value: +966543120557
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_SHEET_WEBHOOK_URL
        sync: false
    plan: free
    autoDeploy: true